name: decode-publish
on:
  push:
    paths:
      - 'publish-queue/**'
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode queued publishes
        run: |
          set -euo pipefail
          git config user.name "ldtt-bot"
          git config user.email "ldtt-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          python3 <<'PY'
          import json, base64, zlib, pathlib, subprocess
          root = pathlib.Path("publish-queue")
          for meta in sorted(root.glob("*.meta.json")):
              base = meta.name[: -len(".meta.json")]
              parts = sorted(root.glob(f"{base}.zb64.*"))
              if parts:
                  zb = "".join(p.read_text() for p in parts).replace("\n", "").replace("\r", "")
                  remove = [meta, *parts]
              else:
                  zbfile = root / f"{base}.zb64"
                  zb = zbfile.read_text().replace("\n", "").replace("\r", "")
                  remove = [meta, zbfile]
              info = json.loads(meta.read_text())
              path = pathlib.Path(info["path"])
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(zlib.decompress(base64.b64decode(zb)))
              subprocess.check_call(["git", "add", str(path)])
              for p in remove:
                  subprocess.check_call(["git", "rm", "-f", str(p)])
              subprocess.call(["git", "commit", "-m", info["message"]])
          subprocess.check_call(["git", "push"])
          PY
